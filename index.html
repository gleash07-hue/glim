<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glim Meme Coin</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg,#1a1a1a,#222);
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
    color: #fff;
    overflow: hidden;
  }
  h1 {
    margin-top: 40px;
    font-size: 48px;
    text-align: center;
  }
  #glim {
    width: 100px;
    height: 100px;
    background: #ffcc00;
    border-radius: 50%;
    position: relative;
    margin-top: 50px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
  }
  /* Eyes */
  .eye {
    width: 12px;
    height: 12px;
    background: #000;
    border-radius: 50%;
    position: absolute;
    top: 30%;
  }
  .eye.left {
    left: 25%;
  }
  .eye.right {
    right: 25%;
  }
  #story {
    margin-top: 30px;
    font-size: 18px;
    text-align: center;
    max-width: 500px;
  }
</style>
</head>
<body>

<h1>GLIM — The Shiniest Meme Coin 🌟</h1>

<div id="glim">
  <div class="eye left"></div>
  <div class="eye right"></div>
</div>

<div id="story">Click Glim to make him jump!</div>

<script>
const glim = document.getElementById('glim');
const story = document.getElementById('story');
let jumps = 0;

glim.addEventListener('click', () => {
  // jump animation
  glim.style.transform = 'translateY(-50px)';
  setTimeout(() => {
    glim.style.transform = 'translateY(0)';
  }, 200);

  // add sparkle effect
  const sparkle = document.createElement('div');
  sparkle.style.position = 'absolute';
  sparkle.style.width = '10px';
  sparkle.style.height = '10px';
  sparkle.style.background = 'radial-gradient(circle,#fff,#ffcc00)';
  sparkle.style.borderRadius = '50%';
  sparkle.style.left = `${Math.random()*100}px`;
  sparkle.style.top = `${Math.random()*100}px`;
  glim.appendChild(sparkle);
  setTimeout(()=> glim.removeChild(sparkle), 300);

  // update story text
  jumps++;
  if(jumps === 1) story.innerText = "Glim jumps for you! 🐾";
  else if(jumps === 3) story.innerText = "Wow! Glim is having fun! 🎉";
  else if(jumps >= 5) story.innerText = "Glim loves you! Keep clicking! 💛";
});
</script>

</body>
</html>
