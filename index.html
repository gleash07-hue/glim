<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glim's Ultimate Living World</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(120deg, #0d0d0d, #1a1a2e);
    color: #fff;
    font-family: 'Courier New', monospace;
    user-select: none;
    cursor: none;
    transition: background 5s ease;
  }

  #glim {
    position: absolute;
    width: 60px;
    height: 60px;
    background: url('https://i.imgur.com/Tk0nKfF.png') no-repeat center/contain;
    pointer-events: none;
    z-index: 10;
    transition: transform 0.2s ease;
  }

  #glim-eyes {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 6px 2px yellow;
    pointer-events: none;
    z-index: 15;
    transition: all 0.2s ease;
  }

  .particle {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    pointer-events: none;
    animation: float 3s infinite ease-in-out;
  }

  @keyframes float {
    0% { transform: translateY(0) scale(0.5); opacity: 0.7; }
    50% { transform: translateY(-20px) scale(1); opacity: 1; }
    100% { transform: translateY(0) scale(0.5); opacity: 0.7; }
  }

  .coin {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: gold;
    box-shadow: 0 0 14px yellow;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  #story {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 600px;
    text-align: center;
    font-size: 1.3em;
    line-height: 1.5em;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="glim"></div>
<div id="glim-eyes"></div>
<div id="story"></div>
<script>
// ====== Variables ======
const glim = document.getElementById('glim');
const glimEyes = document.getElementById('glim-eyes');
const storyDiv = document.getElementById('story');
let coins = [];
let fragmentsCollected = JSON.parse(localStorage.getItem('glimFragments')) || 0;
let storyIndex = 0;
let secretUnlocked = localStorage.getItem('glimSecret') === 'true';
let visitCount = parseInt(localStorage.getItem('glimVisits') || '0') + 1;
localStorage.setItem('glimVisits', visitCount);

const storyLines = [
  "The light bends where you linger.",
  "Glim whispers in shadows you follow.",
  "Coins hide what you forgot.",
  "A flicker of memory moves just beyond.",
  "You are present, and Glim remembers."
];
const secretLine = "glim remembers you.";

// ====== Cursor Glow & Cutesy Eyes ======
document.addEventListener('mousemove', e => {
  glim.style.left = e.clientX - 30 + 'px';
  glim.style.top = e.clientY - 30 + 'px';
  glim.style.transform = `rotate(${Math.sin(Date.now()/200)*12}deg)`;
  createParticle(e.clientX, e.clientY);
  updateEyes(e.clientX, e.clientY);
});

function updateEyes(x, y){
  glimEyes.style.left = x - 6 + 'px';
  glimEyes.style.top = y - 6 + 'px';
  glimEyes.style.boxShadow = `0 0 ${4 + Math.random()*6}px ${2 + Math.random()*2}px yellow`;
  glimEyes.style.transform = `scale(${1 + Math.sin(Date.now()/100)*0.2}) rotate(${Math.sin(Date.now()/150)*15}deg)`;
}

function createParticle(x, y) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = x + 'px';
  p.style.top = y + 'px';
  document.body.appendChild(p);
  setTimeout(() => document.body.removeChild(p), 3500);
}

// ====== Coin Generation ======
function spawnCoin() {
  const c = document.createElement('div');
  c.className = 'coin';
  c.style.left = Math.random() * (window.innerWidth - 35) + 'px';
  c.style.top = Math.random() * (window.innerHeight - 35) + 'px';
  document.body.appendChild(c);
  c.addEventListener('click', () => collectCoin(c));
  coins.push(c);
}

function collectCoin(c) {
  fragmentsCollected++;
  localStorage.setItem('glimFragments', fragmentsCollected);
  c.style.transform = 'scale(1.8)';
  playCoinSound();
  glimCheerAnimation();
  glimBlink();
  setTimeout(()=>c.remove(), 150);
  storyDiv.innerText = storyLines[Math.min(storyIndex, storyLines.length-1)];
  storyIndex++;
  checkSecret();
}

for(let i=0;i<10;i++) spawnCoin();

// ====== Secret Chapter ======
function checkSecret() {
  if(fragmentsCollected >= 10 && !secretUnlocked) {
    secretUnlocked = true;
    localStorage.setItem('glimSecret', 'true');
    setTimeout(() => {
      storyDiv.innerText = secretLine;
      spawnConfetti();
      dynamicBackground();
      glimHopAnimation();
      glimCheerAnimation();
      bonusSecretForVeterans();
    }, 500);
  }
}

// ====== Confetti Effect ======
function spawnConfetti() {
  for(let i=0;i<120;i++) {
    const conf = document.createElement('div');
    conf.className = 'particle';
    conf.style.width = conf.style.height = Math.random()*12+5+'px';
    conf.style.left = Math.random()*window.innerWidth+'px';
    conf.style.top = Math.random()*window.innerHeight+'px';
    conf.style.background = `hsl(${Math.random()*360}, 80%, 60%)`;
    document.body.appendChild(conf);
    setTimeout(()=>conf.remove(), 4500);
  }
}

// ====== Glim Animations ======
function glimHopAnimation(){
  let hops = 0;
  const hopInterval = setInterval(()=>{
    glim.style.transform = `translateY(${Math.sin(hops)*-20}px)`;
    hops += 0.5;
    if(hops > 16) clearInterval(hopInterval);
  }, 40);
}

function glimCheerAnimation(){
  let cheer = 0;
  const cheerInterval = setInterval(()=>{
    glim.style.transform = `translateY(${Math.sin(cheer)*-15}px) scale(${1 + Math.sin(cheer)*0.1}) rotate(${Math.sin(cheer)*10}deg)`;
    cheer += 0.5;
    if(cheer > 12) clearInterval(cheerInterval);
  }, 40);
}

function glimBlink(){
  glimEyes.style.transform += ' scaleY(0.1)';
  setTimeout(()=>glimEyes.style.transform = glimEyes.style.transform.replace(' scaleY(0.1)',''), 150);
}

// ====== Dynamic Background ======
function dynamicBackground(){
  let hue = 0;
  setInterval(()=>{
    hue += 0.3;
    document.body.style.background = `linear-gradient(${hue}deg, #0d0d0d, #1a1a2e)`;
  },50);
}

// ====== Ambient Sound ======
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playChime(){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g);
  g.connect(audioCtx.destination);
  o.type = 'sine';
  o.frequency.value = 440 + Math.random()*250;
  g.gain.value = 0.1;
  o.start();
  o.stop(audioCtx.currentTime + 0.12);
}
setInterval(playChime, 6000);

function playCoinSound(){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g);
  g.connect(audioCtx.destination);
  o.type = 'triangle';
  o.frequency.value = 880 + Math.random()*250;
  g.gain.value = 0.18;
  o.start();
  o.stop(audioCtx.currentTime + 0.15);
}

// ====== Mini Choices ======
function randomChoice() {
  const choice = Math.random();
  if(choice < 0.5){
    storyDiv.innerText = "Follow the shadow?";
  } else {
    storyDiv.innerText = "Chase the spark?";
  }
}
setInterval(randomChoice, 10000);

// ====== Hidden Puzzle Interaction ======
document.addEventListener('keydown', e => {
  if(e.key === 'g' && fragmentsCollected >= 3){
    storyDiv.innerText = "A hidden memory glimmers...";
    spawnConfetti();
    playChime();
    glimCheerAnimation();
    glimBlink();
  }
});

// ====== Veteran Visit Secret ======
function bonusSecretForVeterans(){
  if(visitCount > 3){
    setTimeout(()=>{
      storyDiv.innerText += "\nGlim smiles at your return, traveler.";
      spawnConfetti();
      glimCheerAnimation();
      glimBlink();
    }, 1000);
  }
}
</script>
</body>
</html>
