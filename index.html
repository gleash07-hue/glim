<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>glim</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap');

    * { box-sizing: border-box; cursor: none; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0b0f1a, #000);
      color: #eaeaea;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* custom cursor */
    .cursor {
      position: fixed;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      pointer-events: none;
      background: rgba(191,255,255,0.9);
      box-shadow: 0 0 18px rgba(191,255,255,0.9), 0 0 40px rgba(191,255,255,0.5);
      transform: translate(-50%, -50%);
      z-index: 9999;
      transition: transform 0.05s linear;
    }

    .grain::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('https://grainy-gradients.vercel.app/noise.svg');
      opacity: 0.08;
      pointer-events: none;
      z-index: 2;
    }

    header {
      text-align: center;
      padding: 80px 20px 30px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 5rem);
      letter-spacing: 0.12em;
      margin: 0;
      text-transform: lowercase;
    }

    .tagline {
      opacity: 0.7;
      margin-top: 12px;
      font-weight: 300;
    }

    .glim-container {
      display: flex;
      justify-content: center;
      margin: 50px 0;
    }

    .glim {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, #bfffff 0%, #1b3b4a 45%, #000 70%);
      box-shadow: 0 0 45px rgba(191,255,255,0.45);
      animation: pulse 3s infinite ease-in-out;
      position: relative;
    }

    .glim::before, .glim::after {
      content: "";
      position: absolute;
      top: 50px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #dfffff;
      box-shadow: 0 0 12px #dfffff;
    }

    .glim::before { left: 52px; }
    .glim::after { right: 52px; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 35px rgba(191,255,255,0.3); }
      50% { box-shadow: 0 0 65px rgba(191,255,255,0.65); }
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 60px;
    }

    .btn {
      padding: 14px 26px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.04);
      color: #fff;
      text-decoration: none;
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(191,255,255,0.15);
      box-shadow: 0 0 18px rgba(191,255,255,0.3);
    }

    /* GAME */
    .game {
      max-width: 560px;
      margin: 0 auto 100px;
      padding: 28px;
      border-radius: 26px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      opacity: 0.85;
      margin-bottom: 16px;
    }

    .arena {
      position: relative;
      width: 100%;
      height: 260px;
      border-radius: 18px;
      background: radial-gradient(circle at center, #08121f, #000);
      overflow: hidden;
    }

    .orb {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, #dfffff 0%, #215062 45%, #000 70%);
      box-shadow: 0 0 20px rgba(223,255,255,0.6);
      transition: transform 0.08s ease;
    }

    .orb:hover { transform: scale(1.15); }

    .rare {
      box-shadow: 0 0 40px rgba(255,200,120,0.9);
      background: radial-gradient(circle, #ffe3b0 0%, #7a4b1f 45%, #000 70%);
    }

    footer {
      text-align: center;
      opacity: 0.4;
      padding-bottom: 40px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body class="grain">
  <div class="cursor" id="cursor"></div>

  <header>
    <h1>glim</h1>
    <div class="tagline">a small light in the dark</div>
  </header>

  <div class="glim-container">
    <div class="glim"></div>
  </div>

  <div class="buttons">
    <a class="btn" href="#">buy glim</a>
    <a class="btn" href="#">chart</a>
    <a class="btn" href="#">x</a>
    <a class="btn" href="#">telegram</a>
  </div>

  <section class="game">
    <div class="hud">
      <div>score: <span id="score">0</span></div>
      <div>high: <span id="high">0</span></div>
      <div>time: <span id="time">20</span>s</div>
    </div>

    <div class="arena" id="arena"></div>
    <p style="opacity:.6; margin-top:14px">catch the lights before they escape.</p>
  </section>

  <footer>
    glim exists. no promises. just glow.
  </footer>

  <audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-soft-click-1112.mp3"></audio>

  <script>
    /* cursor glow */
    const cursor = document.getElementById('cursor');
    window.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    const arena = document.getElementById('arena');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');
    const timeEl = document.getElementById('time');
    const clickSound = document.getElementById('clickSound');

    let score = 0;
    let time = 20;
    let high = localStorage.getItem('glimHigh') || 0;
    highEl.textContent = high;

    function spawnOrb() {
      const orb = document.createElement('div');
      orb.className = 'orb';

      const isRare = Math.random() < 0.1;
      if (isRare) orb.classList.add('rare');

      orb.style.left = Math.random() * (arena.clientWidth - 42) + 'px';
      orb.style.top = Math.random() * (arena.clientHeight - 42) + 'px';

      let moved = false;
      orb.addEventListener('mouseenter', () => {
        if (!moved) {
          orb.style.left = Math.random() * (arena.clientWidth - 42) + 'px';
          orb.style.top = Math.random() * (arena.clientHeight - 42) + 'px';
          moved = true;
        }
      });

      orb.onclick = () => {
        clickSound.currentTime = 0;
        clickSound.play();
        score += isRare ? 5 : 1;
        scoreEl.textContent = score;
        orb.remove();
      };

      arena.appendChild(orb);
      setTimeout(() => orb.remove(), isRare ? 1400 : 900);
    }

    const gameLoop = setInterval(() => {
      if (time <= 0) return;
      spawnOrb();
    }, 550);

    const timer = setInterval(() => {
      time--;
      timeEl.textContent = time;
      if (time <= 0) {
        clearInterval(timer);
        clearInterval(gameLoop);
        if (score > high) {
          localStorage.setItem('glimHigh', score);
          highEl.textContent = score;
        }
      }
    }, 1000);
  </script>
</body>
</html>
