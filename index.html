<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glim Mini-Game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #111;
    font-family: sans-serif;
    user-select: none;
  }
  canvas {
    display: block;
    background: #1a1a1a;
  }
  #story {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #fff;
    font-size: 16px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="story">Collect coins to see Glim's story!</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let mouse = { x: canvas.width/2, y: canvas.height/2 };
let coins = [];
let collected = 0;
let storyMessages = [
  "Glim says hi! 👋",
  "You found 1 coin!",
  "Glim is getting excited! ✨",
  "Hidden secret unlocked! Press G!",
  "All coins collected! 🎉"
];
let storyIndex = 0;

// Glim object
let glim = {
  x: canvas.width/2,
  y: canvas.height/2,
  size: 50,
  color: "#ffcc00",
  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
    // eyes
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(this.x - 12, this.y - 10, 5, 0, Math.PI*2);
    ctx.arc(this.x + 12, this.y - 10, 5, 0, Math.PI*2);
    ctx.fill();
  },
  update() {
    // move smoothly toward mouse
    this.x += (mouse.x - this.x) * 0.1;
    this.y += (mouse.y - this.y) * 0.1;
  }
};

// coin class
class Coin {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = 20;
    this.color = "#00ffcc";
    this.collected = false;
  }
  draw() {
    if (!this.collected) {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

// spawn 5 coins
for(let i=0;i<5;i++) coins.push(new Coin());

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  glim.update();
  glim.draw();
  coins.forEach(c => c.draw());
  requestAnimationFrame(draw);
}

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// collect coins on click
canvas.addEventListener('click', e => {
  coins.forEach(c => {
    if(!c.collected) {
      let dx = e.clientX - c.x;
      let dy = e.clientY - c.y;
      if(Math.sqrt(dx*dx + dy*dy) < c.size) {
        c.collected = true;
        collected++;
        storyIndex = Math.min(collected, storyMessages.length-1);
        document.getElementById('story').innerText = storyMessages[storyIndex];
        // Glim reaction: temporarily grow
        glim.size = 70;
        setTimeout(()=> glim.size=50, 300);
      }
    }
  });
});

// easter egg
document.addEventListener('keydown', e => {
  if(e.key.toLowerCase() === 'g' && collected >= 3) {
    alert("Glim remembers you! 🌟");
  }
});

draw();

window.addEventListener('resize', ()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
